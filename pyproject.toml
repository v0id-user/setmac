[project]
name = "setmac"
# Fixed: release versions like 1.2.0-canary.1 are not valid PEP 440, so uv
# rejects them here. The release version lives in [tool.setmac] and setmac/__init__.py.
version = "0.0.0"
description = "macOS developer environment installer"
requires-python = ">=3.12"
dependencies = [
    "python-semantic-release>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["releasetools"]

[tool.setmac]
# Current release, written by semantic-release.
version = "2.0.0"

[tool.semantic_release]
branch = "main"
commit_parser = "releasetools.commit_parser:SetmacCommitParser"
version_toml = ["pyproject.toml:tool.setmac.version"]
version_variables = ["cli/src/setmac/__init__.py:__version__"]
build_command = "bash scripts/release-build.sh"
# Also used as the committer. It must be a verified email on the GitHub account that
# holds the signing key, or GitHub shows release commits as unverified.
commit_author = "semantic-release <hey@v0id.me>"
upload_to_vcs_release = true

[tool.semantic_release.remote]
token = { env = "GH_TOKEN" }
# Push with the checkout's own remote (SSH + release deploy key in CI), not the token.
ignore_token_for_push = true

[tool.semantic_release.changelog]
default_templates = { changelog_file = "CHANGELOG.md" }

[tool.semantic_release.branches.canary]
match = "canary"
prerelease = true
prerelease_token = "canary"

[tool.semantic_release.branches.beta]
match = "beta"
prerelease = true
prerelease_token = "beta"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false
