name: Release Stable

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or ref to release from (e.g. main, beta)"
        required: true
        default: "main"
        type: string

jobs:
  release:
    name: Version and Release (Stable)
    runs-on: macos-26
    # Waits for the maintainer's approval; only this environment can read the signing key.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pushes go over SSH with this deploy key, the only actor allowed to bypass
          # the main ruleset (GitHub Actions itself cannot be a bypass actor on a personal account).
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12_BASE64" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "Skipping certificate import: Apple signing secrets are not configured"
            exit 0
          fi

          CERT_PATH="$RUNNER_TEMP/setmac-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/setmac-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Import release signing key
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: bash scripts/ci-signing-key.sh

      - name: Sync root deps (semantic-release)
        run: uv sync

      - name: Run semantic-release (stable)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: uv run semantic-release version

      - name: Upload artifacts to release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" dist/Setmac.dmg cli/dist/setmac-cli --clobber

      - name: Append install notes to release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          gh release view "$TAG" --json body --jq .body > "$NOTES_FILE"
          cat <<'EOF' >> "$NOTES_FILE"

          ## Install Notes

          - The release commit and tag are GPG-signed (`git tag -v <tag>`).
          - Releases are ad-hoc signed by default and switch to full Developer ID signing and notarization automatically when Apple signing secrets are configured in GitHub Actions.
          - Ad-hoc signed builds are still not notarized, so Gatekeeper may block them after download.
          - If macOS blocks the app as "damaged" or untrusted, move `Setmac.app` to `/Applications` and run `xattr -cr /Applications/Setmac.app`, or Control-click the app and choose `Open`.
          - If Gatekeeper still blocks the app, download the newest release artifact.
          EOF
          gh release edit "$TAG" --notes-file "$NOTES_FILE"
