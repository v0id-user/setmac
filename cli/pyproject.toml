[project]
name = "setmac-cli"
# Fixed: release versions like 1.2.0-canary.1 are not valid PEP 440, so uv
# rejects them here. The release version lives in [tool.setmac] and setmac/__init__.py.
version = "0.0.0"
description = "setmac — macOS setup automator"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
]

[project.scripts]
setmac = "setmac.cli:main"

[dependency-groups]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/setmac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
